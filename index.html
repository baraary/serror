    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue",
      "Noto Sans", Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji",
      "Segoe UI Symbol", "Noto Color Emoji";
    --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono",
      "Courier New", monospace;
    --spacing: .25rem;
    --radius-xs: .125rem;
    --radius-sm: .25rem;
    --radius-md: .375rem;
    --radius-lg: .5rem;
    --radius-xl: .75rem;
    --default-transition-duration: .15s;
    --default-transition-timing-function: cubic-bezier(.4, 0, .2, 1);
    --default-font-family: var(--font-sans);
    --default-mono-font-family: var(--font-mono);
  }
}

@layer base {
  *, :after, :before, ::backdrop {
    box-sizing: border-box;
    border: 0 solid;
    margin: 0;
    padding: 0;
  }

  ::file-selector-button {
    box-sizing: border-box;
    border: 0 solid;
    margin: 0;
    padding: 0;
  }

  html, :host {
    -webkit-text-size-adjust: 100%;
    tab-size: 4;
    line-height: 1.5;
    font-family: var(--default-font-family, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "Noto Sans", Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji");
    font-feature-settings: var(--default-font-feature-settings, normal);
    font-variation-settings: var(--default-font-variation-settings, normal);
    -webkit-tap-highlight-color: transparent;
  }

  hr {
    height: 0;
    color: inherit;
    border-top-width: 1px;
  }

  abbr:where([title]) {
    -webkit-text-decoration: underline dotted;
    text-decoration: underline dotted;
  }

  h1, h2, h3, h4, h5, h6 {
    font-size: inherit;
    font-weight: inherit;
  }

  a {
    color: inherit;
    -webkit-text-decoration: inherit;
    -webkit-text-decoration: inherit;
    -webkit-text-decoration: inherit;
    text-decoration: inherit;
  }

  b, strong {
    font-weight: bolder;
  }

  code, kbd, samp, pre {
    font-family: var(--default-mono-font-family, ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace);
    font-feature-settings: var(--default-mono-font-feature-settings, normal);
    font-variation-settings: var(--default-mono-font-variation-settings, normal);
    font-size: 1em;
  }

  small {
    font-size: 80%;
  }

  sub, sup {
    vertical-align: baseline;
    font-size: 75%;
    line-height: 0;
    position: relative;
  }

  sub {
    bottom: -.25em;
  }

  sup {
    top: -.5em;
  }

  table {
    text-indent: 0;
    border-color: inherit;
    border-collapse: collapse;
  }

  :-moz-focusring:where(:not(iframe)) {
    outline: auto;
  }

  progress {
    vertical-align: baseline;
  }

  summary {
    display: list-item;
  }

  ol, ul, menu {
    list-style: none;
  }

  img, svg, video, canvas, audio, iframe, embed, object {
    vertical-align: middle;
    display: block;
  }

  img, video {
    max-width: 100%;
    height: auto;
  }

  button, input, select, optgroup, textarea {
    font: inherit;
    font-feature-settings: inherit;
    font-variation-settings: inherit;
    letter-spacing: inherit;
    color: inherit;
    opacity: 1;
    background-color: #0000;
    border-radius: 0;
  }

  ::file-selector-button {
    font: inherit;
    font-feature-settings: inherit;
    font-variation-settings: inherit;
    letter-spacing: inherit;
    color: inherit;
    opacity: 1;
    background-color: #0000;
    border-radius: 0;
  }

  :where(select:is([multiple], [size])) optgroup {
    font-weight: bolder;
  }

  :where(select:is([multiple], [size])) optgroup option {
    padding-inline-start: 20px;
  }

  ::file-selector-button {
    margin-inline-end: 4px;
  }

  ::placeholder {
    opacity: 1;
  }

  @supports (not ((-webkit-appearance: -apple-pay-button))) or (contain-intrinsic-size: 1px) {
    ::placeholder {
      color: currentColor;
    }

    @supports (color: color-mix(in lab, red, red)) {
      ::placeholder {
        color: color-mix(in oklab, currentcolor 50%, transparent);
      }
    }
  }

  textarea {
    resize: vertical;
  }

  ::-webkit-search-decoration {
    -webkit-appearance: none;
  }

  ::-webkit-date-and-time-value {
    min-height: 1lh;
    text-align: inherit;
  }

  ::-webkit-datetime-edit {
    display: inline-flex;
  }

  ::-webkit-datetime-edit-fields-wrapper {
    padding: 0;
  }

  ::-webkit-datetime-edit {
    padding-block: 0;
  }

  ::-webkit-datetime-edit-year-field {
    padding-block: 0;
  }

  ::-webkit-datetime-edit-month-field {
    padding-block: 0;
  }

  ::-webkit-datetime-edit-day-field {
    padding-block: 0;
  }

  ::-webkit-datetime-edit-hour-field {
    padding-block: 0;
  }

  ::-webkit-datetime-edit-minute-field {
    padding-block: 0;
  }

  ::-webkit-datetime-edit-second-field {
    padding-block: 0;
  }

  ::-webkit-datetime-edit-millisecond-field {
    padding-block: 0;
  }

  ::-webkit-datetime-edit-meridiem-field {
    padding-block: 0;
  }

  ::-webkit-calendar-picker-indicator {
    line-height: 1;
  }

  :-moz-ui-invalid {
    box-shadow: none;
  }

  button, input:where([type="button"], [type="reset"], [type="submit"]) {
    appearance: button;
  }

  ::file-selector-button {
    appearance: button;
  }

  ::-webkit-inner-spin-button {
    height: auto;
  }

  ::-webkit-outer-spin-button {
    height: auto;
  }

  [hidden]:where(:not([hidden="until-found"])) {
    display: none !important;
  }
}

@layer components;

@layer utilities {
  .visible {
    visibility: visible;
  }

  .absolute {
    position: absolute;
  }

  .fixed {
    position: fixed;
  }

  .static {
    position: static;
  }

  .container {
    width: 100%;

    .container {

  @media (min-width: 48rem) {

  @media (min-width: 64rem) {
    .container {
      max-width: 64rem;
    }
  }

  @media (min-width: 80rem) {
    .container {
      max-width: 80rem;
    }
  }

  @media (min-width: 96rem) {

      max-width: 96rem;
    }
  }

  .m-1 {
    margin: var(--spacing);
  }

  .m-745 {
    margin: calc(var(--spacing) * 745);
  }

  .block {
    display: block;
  }

  .flex {
    display: flex;
  }

  .grid {
    display: grid;
  }

  .hidden {
    display: none;
  }

  .inline {
    display: inline;
  }

  .inline-block {
    display: inline-block;
  }

  .inline-flex {
    display: inline-flex;
  }

  .table {
    display: table;
  }

  .table-cell {
    display: table-cell;
  }

  .table-column {
    display: table-column;
  }

  .table-row {
    display: table-row;
  }

  .transform {
    transform: var(--tw-rotate-x, ) var(--tw-rotate-y, ) var(--tw-rotate-z, ) var(--tw-skew-x, ) var(--tw-skew-y, );
  }

  .resize {
    resize: both;
  }

  .rounded {
    border-radius: .25rem;
  }

  .border {
    border-style: var(--tw-border-style);
    border-width: 1px;
  }

  .lowercase {
    text-transform: lowercase;
  }

  .uppercase {
    text-transform: uppercase;
  }

  .italic {
    font-style: italic;
  }

  .tabular-nums {
    --tw-numeric-spacing: tabular-nums;
    font-variant-numeric: var(--tw-ordinal, ) var(--tw-slashed-zero, ) var(--tw-numeric-figure, ) var(--tw-numeric-spacing, ) var(--tw-numeric-fraction, );
  }

  .underline {
    text-decoration-line: underline;
  }

  .shadow {
    --tw-shadow: 0 1px 3px 0 var(--tw-shadow-color, #0000001a), 0 1px 2px -1px var(--tw-shadow-color, #0000001a);
    box-shadow: var(--tw-inset-shadow), var(--tw-inset-ring-shadow), var(--tw-ring-offset-shadow), var(--tw-ring-shadow), var(--tw-shadow);
  }

  .outline {
    outline-style: var(--tw-outline-style);
    outline-width: 1px;
  }

  .blur {
    --tw-blur: blur(8px);
    filter: var(--tw-blur, ) var(--tw-brightness, ) var(--tw-contrast, ) var(--tw-grayscale, ) var(--tw-hue-rotate, ) var(--tw-invert, ) var(--tw-saturate, ) var(--tw-sepia, ) var(--tw-drop-shadow, );
  }

  .filter {
    filter: var(--tw-blur, ) var(--tw-brightness, ) var(--tw-contrast, ) var(--tw-grayscale, ) var(--tw-hue-rotate, ) var(--tw-invert, ) var(--tw-saturate, ) var(--tw-sepia, ) var(--tw-drop-shadow, );
  }

  .filter\! {
    filter: var(--tw-blur, ) var(--tw-brightness, ) var(--tw-contrast, ) var(--tw-grayscale, ) var(--tw-hue-rotate, ) var(--tw-invert, ) var(--tw-saturate, ) var(--tw-sepia, ) var(--tw-drop-shadow, ) !important;
  }

  .transition {
    transition-property: color, background-color, border-color, outline-color, text-decoration-color, fill, stroke, --tw-gradient-from, --tw-gradient-via, --tw-gradient-to, opacity, box-shadow, transform, translate, scale, rotate, filter, -webkit-backdrop-filter, backdrop-filter, display, content-visibility, overlay, pointer-events;
    transition-timing-function: var(--tw-ease, var(--default-transition-timing-function));
    transition-duration: var(--tw-duration, var(--default-transition-duration));
  }
}

*, :before, :after {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  margin: 0;
  padding: 0;
  font-family: Vazirmatn, system-ui, -apple-system, sans-serif;
}

.tabular-nums {
  font-variant-numeric: tabular-nums;
}

html, body {
  background-color: var(--md-surface);
  width: 100%;
  max-width: 100vw;
  color: var(--md-on-surface);
  min-height: 100%;
  line-height: 1.55;
  overflow-x: hidden;
}

#root {
  width: 100%;
  max-width: 100vw;
  overflow-x: hidden;
}

.app-shell {
  background-color: var(--md-surface);
  flex-direction: column;
  width: 100%;
  max-width: 1440px;
  min-height: 100vh;
  margin: 0 auto;
  padding-bottom: 104px;
  display: flex;
  position: relative;
  overflow-x: hidden;
}

.workspace-body {
  flex: 1;
  width: 100%;
  min-width: 0;
  max-width: 100%;
  display: flex;
}

.desktop-sidebar {
  display: none;
}

@media (min-width: 1024px) {
  .app-shell {
    padding-bottom: 32px;
  }

  .desktop-sidebar {
    background-color: var(--md-surface-container-lowest);
    border-left: 1px solid var(--md-outline-variant);
    flex-direction: column;
    flex-shrink: 0;
    gap: 8px;
    width: 268px;
    height: calc(100vh - 70px);
    padding: 20px 14px;
    display: flex;
    position: sticky;
    top: 70px;
    overflow-y: auto;
  }

  .bottom-nav {
    display: none !important;
  }
}

.sidebar-nav-btn {
  width: 100%;
  height: 50px;
  color: var(--md-on-surface-variant);
  cursor: pointer;
  background: none;
  border: 1px solid #0000;
  border-radius: 16px;
  justify-content: space-between;
  align-items: center;
  padding: 0 16px;
  font-size: .9rem;
  font-weight: 700;
  transition: all .2s cubic-bezier(.2, 0, 0, 1);
  display: flex;
}

.sidebar-nav-btn:hover {
  background-color: var(--md-surface-container-low);
  color: var(--md-on-surface);
}

.sidebar-nav-btn.active {
  background: var(--md-primary-gradient);
  color: #fff;
  box-shadow: 0 8px 20px -4px var(--md-primary-glow);
  font-weight: 800;
}

svg.icon {
  stroke: currentColor;
  stroke-width: 2.1px;
  stroke-linecap: round;
  stroke-linejoin: round;
  fill: none;
  flex-shrink: 0;
  width: 20px;
  height: 20px;
}

svg.icon-sm {
  width: 16px;
  height: 16px;
}

svg.icon-lg {
  width: 24px;
  height: 24px;
}

.top-app-bar {
  z-index: 90;
  background: var(--glass-bg);
  -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--glass-border);
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  width: 100%;
  max-width: 100%;
  padding: 10px 14px;
  display: flex;
  position: sticky;
  top: 0;
}

@media (min-width: 768px) {
  .top-app-bar {
    padding: 12px 24px;
  }
}

.brand-row {
  flex: 1;
  align-items: center;
  gap: 10px;
  min-width: 0;
  display: flex;
}

.brand-squircle {
  background: var(--md-primary-gradient);
  color: #fff;
  width: 42px;
  height: 42px;
  box-shadow: 0 6px 16px -2px var(--md-primary-glow);
  border-radius: 14px;
  flex-shrink: 0;
  justify-content: center;
  align-items: center;
  display: flex;
}

.brand-text-wrap {
  flex-direction: column;
  min-width: 0;
  display: flex;
}

.brand-title {
  color: var(--md-on-surface);
  white-space: nowrap;
  text-overflow: ellipsis;
  letter-spacing: -.2px;
  font-size: .96rem;
  font-weight: 900;
  overflow: hidden;
}

@media (min-width: 640px) {
  .brand-title {
    font-size: 1.08rem;
  }
}

.brand-subtitle {
  color: var(--md-on-surface-variant);
  white-space: nowrap;
  text-overflow: ellipsis;
  font-size: .72rem;
  font-weight: 600;
  overflow: hidden;
}

.top-actions {
  flex-shrink: 0;
  align-items: center;
  gap: 6px;
  display: flex;
}

.accent-picker-bar {
  border-radius: var(--radius-pill);
  background-color: var(--md-surface-container);
  border: 1px solid var(--md-outline-variant);
  align-items: center;
  gap: 5px;
  padding: 4px 8px;
  display: inline-flex;
}

.accent-dot {
  cursor: pointer;
  border: 2px solid #0000;
  border-radius: 50%;
  width: 16px;
  height: 16px;
  padding: 0;
  transition: transform .15s, box-shadow .15s;
}

.accent-dot:hover {
  transform: scale(1.15);
}

.accent-dot.active {
  border-color: var(--md-on-surface);
  transform: scale(1.18);
}

.tonal-icon-btn {
  border: 1px solid var(--md-outline-variant);
  background-color: var(--md-surface-container-lowest);
  min-width: 38px;
  height: 38px;
  color: var(--md-on-surface);
  cursor: pointer;
  white-space: nowrap;
  border-radius: 12px;
  justify-content: center;
  align-items: center;
  gap: 6px;
  padding: 0 11px;
  font-size: .75rem;
  font-weight: 700;
  transition: all .18s;
  display: inline-flex;
  box-shadow: 0 1px 2px #0f172a0a;
}

.tonal-icon-btn:hover {
  border-color: var(--md-primary);
  background-color: var(--md-primary-container);
  color: var(--md-on-primary-container);
}

.tonal-icon-btn:active {
  transform: scale(.95);
}

.tonal-icon-btn.primary-tonal {
  background-color: var(--md-primary-container);
  color: var(--md-on-primary-container);
  border-color: #0000;
}

.tonal-icon-btn.warning-tonal {
  background-color: var(--md-warning-container);
  color: var(--md-on-warning-container);
  border-color: #0000;
}

.tonal-icon-btn.error-tonal {
  background-color: var(--md-error-container);
  color: var(--md-on-error-container);
  border-color: #0000;
}

@media (max-width: 480px) {
  .hide-text-mobile {
    display: none;
  }

  .tonal-icon-btn {
    padding: 0 9px;
  }
}

.bottom-nav {
  background: var(--glass-bg);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--glass-border);
  z-index: 95;
  border-radius: 22px;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  align-items: center;
  height: 70px;
  padding: 4px 6px;
  display: grid;
  position: fixed;
  bottom: 10px;
  left: 12px;
  right: 12px;
  box-shadow: 0 12px 32px -4px #0f172a29;
}

.nav-item {
  cursor: pointer;
  color: var(--md-on-surface-variant);
  -webkit-user-select: none;
  user-select: none;
  background: none;
  border: none;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 3px;
  min-width: 0;
  padding: 4px 2px;
  display: flex;
}

.nav-pill {

  background: #fff;
  border: 1.5px solid #cbd5e1;
  border-radius: 8px;
  overflow: hidden;
}

.a4-section-head {
  color: #0f172a;
  background: #f1f5f9;
  border-bottom: 1.5px solid #cbd5e1;
  justify-content: space-between;
  align-items: center;
  padding: 5px 9px;
  font-size: .74rem;
  font-weight: 900;
  display: flex;
}

.a4-table {
  border-collapse: collapse;
  width: 100%;
  font-size: .69rem;
}

.a4-table thead {
  display: table-header-group;
}

.a4-table tr {
  break-inside: avoid;
}

.a4-table th, .a4-table td {
  text-align: right;
  vertical-align: middle;
  border-bottom: 1px solid #e2e8f0;
  padding: 4px 6px;
}

.a4-table th {
  color: #334155;
  background: #f8fafc;
  font-size: .66rem;
  font-weight: 800;
}

.a4-table tr:nth-child(2n) td {
  background-color: #fcfcfd;
}

.a4-table tr:last-child td {
  border-bottom: none;
}

.a4-mini-bar-track {
  background: #e2e8f0;
  border-radius: 99px;
  width: 100%;
  height: 6px;
  overflow: hidden;
}

.a4-mini-bar-fill {
  border-radius: 99px;
  height: 100%;
}

.a4-vital-badge {
  color: #be123c;
  background: #ffe4e6;
  border-radius: 4px;
  margin-right: 4px;
  padding: 1px 5px;
  font-size: .58rem;
  font-weight: 800;
  display: inline-block;
}

.a4-signatures {
  color: #1e293b;
  break-inside: avoid;
  border-top: 1.5px dashed #94a3b8;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-top: 10px;
  padding-top: 8px;
  font-size: .72rem;
  font-weight: 800;
  display: grid;
}

.a4-sig-box {
  background: #fafafa;
  border: 1px solid #cbd5e1;
  border-radius: 8px;
  flex-direction: column;
  justify-content: space-between;
  min-height: 54px;
  padding: 8px 10px;
  display: flex;
}

@media print {
  @page {
    size: A4 portrait;
    margin: 8mm;
  }

  .top-app-bar, .bottom-nav, .desktop-sidebar, .no-print, .no-print-dashboard, #m3Snackbar, .sheet-backdrop {
    display: none !important;
  }

  .app-shell, .workspace-body, .main-content {
    width: 100% !important;
    max-width: 100% !important;
    box-shadow: none !important;
    background: #fff !important;
    margin: 0 !important;
    padding: 0 !important;
    overflow: visible !important;
  }

  body, html {
    color: #000 !important;
    -webkit-print-color-adjust: exact !important;
    print-color-adjust: exact !important;
    background: #fff !important;
  }

  .official-print-only {
    display: block !important;
  }
}
